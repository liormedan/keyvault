<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{web.title}}</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --ink:#1d2433; --muted:#6b7280; --line:#e5e1d8; --accent:#2f5d50; --danger:#a33a2c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1d222b; --ink:#e8e6e1; --muted:#9aa1ad; --line:#2c323d; --accent:#7fb8a4; --danger:#e08a7c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.5 system-ui, "Segoe UI", Arial, sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; flex:1; }
  input, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input[type=search] { width:min(320px, 100%); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:inherit; border-radius:8px; padding:6px 12px; cursor:pointer; min-height:36px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  button.danger { color:var(--danger); }
  main { max-width:900px; margin:0 auto; padding:20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; }
  section h2 { font-size:15px; margin:0; padding:12px 16px; border-bottom:1px solid var(--line); }
  .row { display:grid; grid-template-columns: minmax(140px, 1fr) 2fr auto; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .name { font-family: ui-monospace, Consolas, monospace; direction:ltr; text-align:right; word-break:break-all; }
  .note { color:var(--muted); font-size:13px; }
  .val { font-family: ui-monospace, Consolas, monospace; direction:ltr; text-align:left; word-break:break-all; background:var(--bg); padding:2px 6px; border-radius:6px; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:min(480px, 92vw); }
  dialog form { display:grid; gap:10px; }
  dialog label { display:grid; gap:4px; font-size:13px; color:var(--muted); }
  .toast { position:fixed; bottom:16px; left:16px; background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; }
  .toast.on { opacity:1; }
  .empty { color:var(--muted); text-align:center; padding:40px; }
  .path { color:var(--muted); font-size:12px; direction:ltr; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .actions { justify-content:flex-start; } }
</style>
</head>
<body>
<header>
  <h1>{{web.title}}</h1>
  <input type="search" id="q" placeholder="{{web.search}}" aria-label="{{web.searchLabel}}">
  <button class="primary" id="add">{{web.add}}</button>
  <button id="lock">{{web.lock}}</button>
</header>
<main>
  <div id="list"></div>
  <p class="path" id="path"></p>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle" style="margin:0;font-size:16px">{{web.add}}</h2>
    <label>{{web.project}} <input name="p" required placeholder="my-app" dir="ltr"></label>
    <label>{{web.keyName}} <input name="k" required placeholder="SMTP_PASS" dir="ltr"></label>
    <label>{{web.value}} <input name="value" type="password" required autocomplete="off" dir="ltr"></label>
    <label>{{web.note}} <input name="note" placeholder="{{web.notePlaceholder}}"></label>
    <div class="actions"><button value="cancel" formnovalidate>{{web.cancel}}</button><button class="primary" value="ok">{{web.save}}</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const T = {{T}};
const TOKEN = location.hash.slice(1);
history.replaceState(null, "", "/"); // the token does not stay in the address bar
const api = async (path, body) => {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-KV-Token": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
};
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, attrs); e.append(...kids); return e; };
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); };
let projects = {};

async function load() {
  try {
    const j = await api("/api/list");
    projects = j.projects; $("#path").textContent = j.vault; render();
  } catch (e) { $("#list").replaceChildren(el("p", { className: "empty", textContent: T["web.gone"] })); }
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const out = [];
  for (const p of Object.keys(projects).sort()) {
    const rows = projects[p].filter((e) => !q || p.toLowerCase().includes(q) || e.key.toLowerCase().includes(q) || (e.note || "").toLowerCase().includes(q));
    if (!rows.length) continue;
    out.push(el("section", {}, el("h2", { textContent: p }), ...rows.map((e) => row(p, e))));
  }
  $("#list").replaceChildren(...(out.length ? out : [el("p", { className: "empty", textContent: q ? T["web.noResults"] : T["web.empty"] })]));
}

function row(p, e) {
  const shown = el("span");
  const reveal = el("button", { textContent: T["web.show"], onclick: async () => {
    if (shown.textContent) { shown.replaceChildren(); reveal.textContent = T["web.show"]; return; }
    const { value } = await api(`/api/value?p=${encodeURIComponent(p)}&k=${encodeURIComponent(e.key)}`);
    shown.replaceChildren(el("span", { className: "val", textContent: value })); reveal.textContent = T["web.hide"];
    setTimeout(() => { shown.replaceChildren(); reveal.textContent = T["web.show"]; }, 15000);
  }});
  const copy = el("button", { textContent: T["web.copy"], onclick: async () => {
    const { value } = await api(`/api/value?p=${encodeURIComponent(p)}&k=${encodeURIComponent(e.key)}`);
    await navigator.clipboard.writeText(value);
    toast(T["web.copied"]);
    setTimeout(async () => { try { if ((await navigator.clipboard.readText()) === value) await navigator.clipboard.writeText(""); } catch {} }, 20000);
  }});
  const edit = el("button", { textContent: T["web.editBtn"], onclick: () => openDlg(p, e) });
  const del = el("button", { className: "danger", textContent: T["web.delete"], onclick: async () => {
    if (!confirm(T["web.confirmDelete"].replace("{ref}", `${p}/${e.key}`))) return;
    await api("/api/delete", { p, k: e.key }); toast(T["web.deleted"]); load();
  }});
  return el("div", { className: "row" },
    el("div", {}, el("div", { className: "name", textContent: e.key }), el("div", { className: "note", textContent: e.note || "" })),
    shown,
    el("div", { className: "actions" }, reveal, copy, edit, del));
}

function openDlg(p, e) {
  const f = $("#form");
  f.reset();
  $("#dlgTitle").textContent = e ? T["web.edit"] : T["web.add"];
  f.p.value = p || ""; f.k.value = e?.key || ""; f.note.value = e?.note || "";
  f.p.readOnly = f.k.readOnly = !!e;
  f.value.placeholder = e ? T["web.newValue"] : "";
  $("#dlg").showModal();
}

$("#dlg").addEventListener("close", async () => {
  if ($("#dlg").returnValue !== "ok") return;
  const f = $("#form");
  try { await api("/api/set", { p: f.p.value, k: f.k.value, value: f.value.value, note: f.note.value }); f.value.value = ""; toast(T["web.saved"]); load(); }
  catch (e) { toast(e.message); }
});
$("#add").onclick = () => openDlg();
$("#q").oninput = render;
$("#lock").onclick = async () => { await api("/api/lock", {}).catch(() => {}); document.body.replaceChildren(el("p", { className: "empty", textContent: T["web.lockedNow"] })); };
load();
</script>
</body>
</html>
