[package]
name = "kv-vault"
version = "0.9.0"
description = "Local encrypted vault for developer keys — desktop app"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
