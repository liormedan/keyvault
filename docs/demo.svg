<svg xmlns="http://www.w3.org/2000/svg" width="860" height="488" viewBox="0 0 860 488" role="img" aria-label="kv-vault in a terminal">
  <style>
    text { font: 13px ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; white-space: pre; }
    .cmd { fill: #e6edf3; font-weight: 600; } .out { fill: #9aa4b0; } .warn { fill: #f0a868; }
  </style>
  <rect width="860" height="488" rx="10" fill="#14171d"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="24" text-anchor="middle" class="out">kv-vault — real output, generated by scripts/demo-svg.mjs</text>
  <text x="20" y="60" class="cmd">$ kv init-project</text>
  <text x="20" y="80" class="out">Created ~/my-app/.kv.json → project my-app. It holds only the name, so it is safe to commit.</text>
  <text x="20" y="100" class="out"></text>
  <text x="20" y="120" class="cmd">$ echo sk_live_8f2c… | kv set my-app/STRIPE_KEY</text>
  <text x="20" y="140" class="out">Saved: my-app/STRIPE_KEY</text>
  <text x="20" y="160" class="out"></text>
  <text x="20" y="180" class="cmd">$ echo postgres://… | kv set my-app/DATABASE_URL</text>
  <text x="20" y="200" class="out">Saved: my-app/DATABASE_URL</text>
  <text x="20" y="220" class="out"></text>
  <text x="20" y="240" class="cmd">$ kv ls</text>
  <text x="20" y="260" class="out">my-app</text>
  <text x="20" y="280" class="out">  DATABASE_URL</text>
  <text x="20" y="300" class="out">  STRIPE_KEY</text>
  <text x="20" y="320" class="out"></text>
  <text x="20" y="340" class="cmd">$ kv run -- node -e "console.log(Object.keys(process.env).filter(k =&gt; k.startsWith('STRIPE')))"</text>
  <text x="20" y="360" class="out">[ 'STRIPE_KEY' ]</text>
  <text x="20" y="380" class="out"></text>
  <text x="20" y="400" class="cmd">$ git add config.js &amp;&amp; kv guard</text>
  <text x="20" y="420" class="warn">kv guard: 1 vault value(s) found — the commit is stopped:</text>
  <text x="20" y="440" class="out">  config.js:1  my-app/STRIPE_KEY</text>
  <text x="20" y="460" class="out">Move them out (kv run / kv env), or remove them from the commit. To skip once: git commit --no-verify</text>
</svg>
